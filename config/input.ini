# p3fes input map (pad port 0, a DUALSHOCK 2). Read from config\input.ini when present (or --input-config PATH);
# these are also the built-in defaults (runtime/app/input.cpp default_input_config; tests/app checks they agree).
#
# [keyboard]: control = KEY[, KEY ...] (any listed key held = pressed; empty = unbound). Key names are Win32 virtual
# keys: A-Z 0-9 F1-F24 NUMPAD0-NUMPAD9 UP DOWN LEFT RIGHT ENTER SPACE BACKSPACE TAB ESCAPE SHIFT CTRL ALT LSHIFT
# RSHIFT LCTRL RCTRL LALT RALT INSERT DELETE HOME END PAGEUP PAGEDOWN SEMICOLON EQUALS COMMA MINUS PERIOD SLASH
# GRAVE LBRACKET BACKSLASH RBRACKET APOSTROPHE NUMPAD_ADD NUMPAD_SUBTRACT NUMPAD_MULTIPLY NUMPAD_DIVIDE
# NUMPAD_DECIMAL. A stick direction pushes that axis to full deflection; opposite directions cancel.
[keyboard]
up = UP
down = DOWN
left = LEFT
right = RIGHT
triangle = I
circle = L
cross = K
square = J
l1 = Q
l2 = 1
r1 = E
r2 = 3
l3 = 2
r3 = 4
start = ENTER
select = BACKSPACE
lstick_up = W
lstick_down = S
lstick_left = A
lstick_right = D
rstick_up = T
rstick_down = G
rstick_left = F
rstick_right = H

# [gamepad]: one XInput controller alongside the keyboard (buttons OR'ed; a stick the keyboard deflects wins).
# A Cross, B Circle, X Square, Y Triangle, LB L1, RB R1, LT L2, RT R2, LS L3, RS R3, Start, Back = Select.
# index = auto (the first connected) or 0..3; dead zones are radial fractions of full deflection (0..0.95);
# L2/R2 are pressed when the trigger reads above trigger_threshold (0..255).
[gamepad]
index = auto
deadzone_left = 0.24
deadzone_right = 0.265
trigger_threshold = 30

# [hotkeys]: host actions, not guest input (empty = none). Alt+Enter always toggles full screen.
[hotkeys]
screenshot = F12
fullscreen = F11
